# FnB Group ERP — stack produksi: MongoDB + backend FastAPI + web (Caddy: build React, /api proxy, HTTPS).
# Panduan lengkap: docs/DEPLOY.md. Ringkas:
#   cp deploy/env.production.example .env   # isi SITE_ADDRESS, CORS_ORIGINS, JWT_SECRET, SECRETS_ENCRYPTION_KEY
#   docker compose up -d --build
name: fnb-erp

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    # Tidak dipublikasikan ke host: hanya bisa diakses backend lewat jaringan internal compose.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: ${DB_NAME:-fnb_erp}
      JWT_SECRET: ${JWT_SECRET:?Isi JWT_SECRET di .env (lihat deploy/env.production.example)}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:?Isi SECRETS_ENCRYPTION_KEY di .env (lihat deploy/env.production.example)}
      CORS_ORIGINS: ${CORS_ORIGINS:?Isi CORS_ORIGINS di .env, mis. https://erp.contoh.com}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      UPLOAD_DIR: /data/uploads
      SECRETS_KEY_FILE: /data/secrets/.app_secret
      RATE_LIMIT_BYPASS_LOOPBACK: "false"
    volumes:
      - uploads:/data/uploads
      - secrets:/data/secrets
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data      # sertifikat HTTPS — jangan dihapus
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data:
  uploads:
  secrets:
  caddy_data:
  caddy_config:
