name: CI

# Pemeriksaan otomatis tiap push & pull request:
# - backend: tes tanpa jaringan/DB (mongomock) — Asisten AI, Impor Cerdas, WhatsApp, Menu & Resep, kunci scheduler
# - audit: aturan design system (ux_audit --strict), target tour, IA/izin route, pengetahuan Pemandu tidak basi
# - frontend: build produksi (galat kompilasi/impor)
# Tes integrasi lain di backend/tests butuh backend berjalan + MongoDB + data demo — belum di CI.

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (tes offline)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: ci-test-secret-not-used-in-production-0123456789
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: ci_test
      SCHEDULER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Tes offline
        run: >
          python -m pytest -q -p no:cacheprovider
          tests/test_ai_agent.py tests/test_ai_client.py tests/test_smart_import.py tests/test_wa_bot.py
          tests/test_ai_finance.py tests/test_ai_purchasing_audit.py tests/test_menu_recipe.py tests/test_ai_steward.py
          tests/test_ai_knowledge.py tests/test_ai_automations.py tests/test_ai_quality.py tests/test_ai_action_coverage.py
          tests/test_ai_reconcile.py tests/test_ai_auditor_more.py tests/test_ai_domain.py tests/test_smart_import_records.py
          tests/test_scheduler_lock.py

  audit:
    name: Audit UI, tour & navigasi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4          # gen_ai_guide.py membaca definisi tour/route lewat node
        with:
          node-version: "22"
      - run: python3 scripts/ux_audit.py --strict
      - run: python3 scripts/audit_tours.py --strict
      - run: python3 scripts/audit_ui_ia.py
      - name: Pengetahuan Pemandu AI tidak basi
        run: |
          python3 scripts/gen_ai_guide.py
          git diff --exit-code -- backend/services/ai/agent/app_guide.json || {
            echo "::error::app_guide.json basi — jalankan python3 scripts/gen_ai_guide.py lalu commit"; exit 1; }

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: yarn install --network-timeout 600000
      - name: Build
        env:
          CI: "false"
          GENERATE_SOURCEMAP: "false"
          REACT_APP_BACKEND_URL: ""
          NODE_OPTIONS: --max-old-space-size=4096
        run: yarn build
